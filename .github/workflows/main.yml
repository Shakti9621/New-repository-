name: Build Windows portable EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.10.0

      - name: Build PDFViewer.exe
        run: pyinstaller --noconfirm --onefile --windowed --name PDFViewer main.py

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $dir = "PDFViewer-Portable"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "dist/PDFViewer.exe" -Destination $dir
          Copy-Item "README.md" -Destination "$dir/README.txt"

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: PDFViewer-Portable
          path: PDFViewer-Portable
